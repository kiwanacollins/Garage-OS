# Production Docker Compose for Coolify deployment
# Build all services on the host first: npm run build
# Then deploy with: docker-compose -f docker-compose.prod.yml up -d

x-common-env: &common-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-garageos}:${POSTGRES_PASSWORD}@garageos-postgres:5432/${POSTGRES_DB:-garageos}
  REDIS_URL: "redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}garageos-redis:6379"
  JWT_SECRET: ${JWT_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  SMTP_URL: ${SMTP_URL}
  MAIL_FROM: ${MAIL_FROM}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-garageos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garageos_prod}
      POSTGRES_DB: ${POSTGRES_DB:-garageos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'garageos', '-d', 'garageos']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      garageos-network:
        aliases:
          - garageos-postgres
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: sh -c "redis-server $${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      garageos-network:
        aliases:
          - garageos-redis
    restart: unless-stopped

  # ── Database Setup (migrations + seed) ────────────────────────────────────
  setup:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: migrate
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - garageos-network
    restart: "no"

  # ── API ───────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: api
    environment:
      <<: *common-env
      PORT: ${API_PORT:-3001}
      HOST: 0.0.0.0
      CORS_ORIGIN: ${CORS_ORIGIN}
      UPLOAD_STORAGE_DIR: /app/uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
      UPLOAD_PUBLIC_BASE_URL: ${UPLOAD_PUBLIC_BASE_URL}
      # PesaPal configuration
      PESAPAL_BASE_URL: ${PESAPAL_BASE_URL}
      PESAPAL_CONSUMER_KEY: ${PESAPAL_CONSUMER_KEY}
      PESAPAL_CONSUMER_SECRET: ${PESAPAL_CONSUMER_SECRET}
      PESAPAL_CALLBACK_URL: ${PESAPAL_CALLBACK_URL}
      PESAPAL_NOTIFICATION_ID: ${PESAPAL_NOTIFICATION_ID}
    expose:
      - "${API_PORT:-3001}"
    volumes:
      - uploads_data:/app/uploads
# Uses CMD from Dockerfile - node apps/api/dist/server.js
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - garageos-network
      - coolify
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:${API_PORT:-3001}/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "coolify.managed=true"
      - "traefik.docker.network=coolify"

  # ── Web (Next.js) ────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"
# Uses CMD from Dockerfile - node apps/web/server.js
    depends_on:
      - api
    networks:
      - garageos-network
      - coolify
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "coolify.managed=true"
      - "traefik.docker.network=coolify"

  # ── Queue Worker ──────────────────────────────────────────────────────────
  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: queue
    environment:
      <<: *common-env
# Uses CMD from Dockerfile - node workers/queue/dist/index.js
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - garageos-network
    restart: unless-stopped
    labels:
      - "coolify.managed=true"

volumes:
  postgres_data:
  uploads_data:

networks:
  garageos-network:
    driver: bridge
  coolify:
    external: true
    name: coolify