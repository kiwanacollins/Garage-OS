# Production Docker Compose for Coolify deployment
# This uses environment variables for all configuration

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-garageos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-garageos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-garageos}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - garageos-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - garageos-network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    environment:
      - NODE_ENV=production
      - PORT=${API_PORT:-3001}
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-garageos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-garageos}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - UPLOAD_STORAGE_DIR=/app/uploads
      - UPLOAD_MAX_BYTES=${UPLOAD_MAX_BYTES:-10485760}
      - UPLOAD_PUBLIC_BASE_URL=${UPLOAD_PUBLIC_BASE_URL}
      - SMTP_URL=${SMTP_URL}
      - MAIL_FROM=${MAIL_FROM}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # PesaPal configuration
      - PESAPAL_BASE_URL=${PESAPAL_BASE_URL}
      - PESAPAL_CONSUMER_KEY=${PESAPAL_CONSUMER_KEY}
      - PESAPAL_CONSUMER_SECRET=${PESAPAL_CONSUMER_SECRET}
      - PESAPAL_CALLBACK_URL=${PESAPAL_CALLBACK_URL}
      - PESAPAL_NOTIFICATION_ID=${PESAPAL_NOTIFICATION_ID}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - garageos-network
    restart: unless-stopped
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.garageos-api.rule=Host(`${API_DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.services.garageos-api.loadbalancer.server.port=3001"\n\n  web:\n    build:\n      context: .\n      dockerfile: apps/web/Dockerfile\n      target: runtime\n    environment:\n      - NODE_ENV=production\n      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}\n    depends_on:\n      - api\n    networks:\n      - garageos-network\n    restart: unless-stopped\n    labels:\n      - \"coolify.managed=true\"\n      - \"traefik.enable=true\"\n      - \"traefik.http.routers.garageos-web.rule=Host(`${WEB_DOMAIN}`)\"\n      - \"traefik.http.services.garageos-web.loadbalancer.server.port=3000\"\n\n  queue-worker:\n    build:\n      context: .\n      dockerfile: workers/queue/Dockerfile\n      target: runtime\n    environment:\n      - NODE_ENV=production\n      - DATABASE_URL=postgresql://${POSTGRES_USER:-garageos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-garageos}\n      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379\n      - SMTP_URL=${SMTP_URL}\n      - MAIL_FROM=${MAIL_FROM}\n      - LOG_LEVEL=${LOG_LEVEL:-info}\n    depends_on:\n      postgres:\n        condition: service_healthy\n      redis:\n        condition: service_healthy\n    networks:\n      - garageos-network\n    restart: unless-stopped\n    labels:\n      - \"coolify.managed=true\"\n\nvolumes:\n  postgres_data:\n\nnetworks:\n  garageos-network:\n    driver: bridge