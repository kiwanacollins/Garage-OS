# Production Docker Compose for Coolify deployment
# Build all services on the host first: npm run build
# Then deploy with: docker-compose -f docker-compose.prod.yml up -d

x-common-env: &common-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-garageos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-garageos}
  REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
  JWT_SECRET: ${JWT_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  SMTP_URL: ${SMTP_URL}
  MAIL_FROM: ${MAIL_FROM}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-garageos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-garageos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-garageos}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - garageos-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - garageos-network
    restart: unless-stopped

  # ── Migration (one-shot) ──────────────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.prod
    environment:
      <<: *common-env
    command: >
      sh -c "npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma &&
             npx tsx packages/db/prisma/seed.ts"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - garageos-network
    restart: "no"
    profiles: ["setup"]

  # ── API ───────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: garageos-api
    environment:
      <<: *common-env
      PORT: ${API_PORT:-3001}
      HOST: 0.0.0.0
      CORS_ORIGIN: ${CORS_ORIGIN}
      UPLOAD_STORAGE_DIR: /app/uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
      UPLOAD_PUBLIC_BASE_URL: ${UPLOAD_PUBLIC_BASE_URL}
      # PesaPal configuration
      PESAPAL_BASE_URL: ${PESAPAL_BASE_URL}
      PESAPAL_CONSUMER_KEY: ${PESAPAL_CONSUMER_KEY}
      PESAPAL_CONSUMER_SECRET: ${PESAPAL_CONSUMER_SECRET}
      PESAPAL_CALLBACK_URL: ${PESAPAL_CALLBACK_URL}
      PESAPAL_NOTIFICATION_ID: ${PESAPAL_NOTIFICATION_ID}
    ports:
      - "${API_PORT:-3001}:${API_PORT:-3001}"
    volumes:
      - uploads_data:/app/uploads
    command: npm run start --workspace=@garage-os/api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - garageos-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${API_PORT:-3001}/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "coolify.managed=true"

  # ── Web (Next.js) ────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: garageos-web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      PORT: 3000
    ports:
      - "3000:3000"
    command: npm run start --workspace=@garage-os/web
    depends_on:
      - api
    networks:
      - garageos-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "coolify.managed=true"

  # ── Queue Worker ──────────────────────────────────────────────────────────
  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: garageos-queue-worker
    environment:
      <<: *common-env
    command: npm run start --workspace=@garage-os/queue
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - garageos-network
    restart: unless-stopped
    labels:
      - "coolify.managed=true"

volumes:
  postgres_data:
  uploads_data:

networks:
  garageos-network:
    driver: bridge