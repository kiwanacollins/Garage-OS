# Development Docker Compose - Single build, multiple containers
services:
  # Infrastructure services
  postgres:
    image: postgres:16-alpine
    container_name: garageos-postgres
    environment:
      POSTGRES_USER: garageos
      POSTGRES_PASSWORD: garageos_dev
      POSTGRES_DB: garageos
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U garageos']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - garageos-network

  redis:
    image: redis:7-alpine
    container_name: garageos-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - garageos-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: garageos-mailhog
    ports:
      - '1025:1025'
      - '8025:8025'
    networks:
      - garageos-network

  # Application services
  app:
    build:
      context: .
      dockerfile: Dockerfile.single
    container_name: garageos-app
    environment:
      - NODE_ENV=development
      - PORT=3001
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://garageos:garageos_dev@postgres:5432/garageos
      - REDIS_URL=redis://redis:6379
      - SMTP_URL=smtp://mailhog:1025
      - JWT_SECRET=dev_jwt_secret_change_in_production
      - JWT_REFRESH_SECRET=dev_jwt_refresh_secret_change_in_production
      - CORS_ORIGIN=http://localhost:3000
      - UPLOAD_STORAGE_DIR=/app/uploads
      - UPLOAD_MAX_BYTES=10485760
      - UPLOAD_PUBLIC_BASE_URL=http://localhost:3001/uploads
      - MAIL_FROM=GarageOS <no-reply@garageos.local>
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    volumes:
      - .:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    ports:
      - '3001:3001'
    command: npm run dev --workspace=@garage-os/api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - garageos-network
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.single
    container_name: garageos-web
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - '3000:3000'
    command: npm run dev --workspace=@garage-os/web
    depends_on:
      - app
    networks:
      - garageos-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  garageos-network:
    driver: bridge