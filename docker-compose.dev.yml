# Development Docker Compose
# node_modules are copied from host — no in-container npm install needed.
# Run `npm install` on host first, then `docker-compose -f docker-compose.dev.yml up --build`

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile.single

x-app-env: &app-env
  DATABASE_URL: postgresql://garageos:garageos_dev@postgres:5432/garageos
  REDIS_URL: redis://redis:6379
  SMTP_URL: smtp://mailhog:1025
  MAIL_FROM: "GarageOS <no-reply@garageos.local>"
  JWT_SECRET: dev_jwt_secret_change_in_production
  JWT_REFRESH_SECRET: dev_jwt_refresh_secret_change_in_production
  NODE_ENV: development
  LOG_LEVEL: info

services:
  # ── Infrastructure ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: garageos-postgres
    environment:
      POSTGRES_USER: garageos
      POSTGRES_PASSWORD: garageos_dev
      POSTGRES_DB: garageos
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U garageos']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - garageos-network

  redis:
    image: redis:7-alpine
    container_name: garageos-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - garageos-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: garageos-mailhog
    ports:
      - '1025:1025'
      - '8025:8025'
    networks:
      - garageos-network

  # ── API ────────────────────────────────────────────────────────────────────
  api:
    build: *app-build
    container_name: garageos-api
    environment:
      <<: *app-env
      PORT: 3001
      HOST: 0.0.0.0
      CORS_ORIGIN: http://localhost:3000
      UPLOAD_STORAGE_DIR: /app/uploads
      UPLOAD_MAX_BYTES: 10485760
      UPLOAD_PUBLIC_BASE_URL: http://localhost:3001/uploads
    ports:
      - '3001:3001'
    volumes:
      - node_modules_cache:/app/node_modules
      - uploads_data:/app/uploads
    command: npm run dev --workspace=@garage-os/api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - garageos-network
    restart: unless-stopped

  # ── Web (Next.js) ─────────────────────────────────────────────────────────
  web:
    build: *app-build
    container_name: garageos-web
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
      PORT: 3000
    ports:
      - '3000:3000'
    volumes:
      - node_modules_cache:/app/node_modules
    command: npm run dev --workspace=@garage-os/web
    depends_on:
      - api
    networks:
      - garageos-network
    restart: unless-stopped

  # ── Queue worker ───────────────────────────────────────────────────────────
  queue:
    build: *app-build
    container_name: garageos-queue
    environment:
      <<: *app-env
    volumes:
      - node_modules_cache:/app/node_modules
    command: npm run dev --workspace=@garage-os/queue
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - garageos-network
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  node_modules_cache:

networks:
  garageos-network:
    driver: bridge